# 生产编排：镜像来自阿里云 ACR，不在服务器上构建。
# 使用前把 .env.example 复制为 .env 并填写。
name: onestarlab

services:
  onestarlab:
    image: ${ACR_IMAGE:?请在 .env 中设置 ACR_IMAGE}:${IMAGE_TAG:-latest}
    container_name: onestarlab
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/onestar.db
      WEB_DIR: /app/web
      TZ: ${TZ:-Asia/Shanghai}
      API_TOKEN: ${API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
